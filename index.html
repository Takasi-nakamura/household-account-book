<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="すばやく記録して、支出を見える化するPWA家計簿">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>kakei — 家計簿</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">¥</span>
        <div><strong>kakei</strong><small>家計簿</small></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="shareBtn" title="データを共有">↗</button>
        <button class="icon-btn" id="themeBtn" title="テーマ切替">☾</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">QUICK ENTRY</p>
          <h1>使ったら、すぐ記録。</h1>
          <p class="sub">店名・ジャンル・金額だけ。登録は1タップ。</p>
        </div>
        <div class="month-total">
          <span id="monthLabel">今月</span>
          <strong id="monthTotal">¥0</strong>
        </div>
      </section>

      <section class="quick-card">
        <form id="expenseForm" autocomplete="off">
          <label class="field store-field">
            <span>どこで買った？</span>
            <input id="store" name="store" type="text" placeholder="例：コンビニ、Amazon" maxlength="50" required autofocus>
          </label>
          <label class="field">
            <span>ジャンル</span>
            <select id="category" name="category">
              <option>食費</option><option>日用品</option><option>交通</option><option>趣味</option>
              <option>衣服</option><option>美容</option><option>固定費</option><option>医療</option><option>その他</option>
            </select>
          </label>
          <label class="field amount-field">
            <span>金額</span>
            <div class="amount-input"><b>¥</b><input id="amount" name="amount" inputmode="decimal" type="number" min="1" step="1" placeholder="0" required></div>
          </label>
          <button class="primary-btn" type="submit">登録する <span>↵</span></button>
        </form>
        <p class="hint">Enterキーでも登録できます</p>
      </section>

      <nav class="tabs" aria-label="表示切替">
        <button class="tab active" data-tab="home">ホーム</button>
        <button class="tab" data-tab="analysis">分析</button>
        <button class="tab" data-tab="history">履歴</button>
      </nav>

      <section id="homeView" class="view active">
        <div class="section-head"><div><p class="eyebrow">OVERVIEW</p><h2>今日の支出</h2></div><span id="todayTotal" class="pill">¥0</span></div>
        <div id="todayList" class="expense-list empty-state"><div class="empty-icon">◎</div><p>まだ記録がありません</p><small>上のフォームから最初の支出を追加しよう。</small></div>
        <div class="section-head recent-head"><div><p class="eyebrow">RECENT</p><h2>最近の支出</h2></div></div>
        <div id="recentList" class="expense-list"></div>
      </section>

      <section id="analysisView" class="view">
        <div class="section-head"><div><p class="eyebrow">ANALYSIS</p><h2>お金の使い道</h2></div><select id="analysisRange" class="range-select"><option value="month">今月</option><option value="all">全期間</option></select></div>
        <div class="stats-grid">
          <div class="stat-card"><span>支出合計</span><strong id="analysisTotal">¥0</strong></div>
          <div class="stat-card"><span>1回あたり</span><strong id="analysisAvg">¥0</strong></div>
          <div class="stat-card"><span>記録件数</span><strong id="analysisCount">0件</strong></div>
        </div>
        <div class="chart-card">
          <div class="chart-title"><strong>ジャンル別</strong><span id="topCategory">—</span></div>
          <div class="donut-wrap"><div id="donut" class="donut"><div><strong id="donutTotal">¥0</strong><span>合計</span></div></div><div id="legend" class="legend"></div></div>
        </div>
        <div class="chart-card"><div class="chart-title"><strong>日別の推移</strong><span>直近14日</span></div><div id="barChart" class="bar-chart"></div></div>
      </section>

      <section id="historyView" class="view">
        <div class="section-head"><div><p class="eyebrow">HISTORY</p><h2>履歴</h2></div><button id="clearBtn" class="text-btn">全削除</button></div>
        <div class="toolbar"><input id="searchInput" type="search" placeholder="店名を検索"><select id="filterCategory"><option value="">すべてのジャンル</option><option>食費</option><option>日用品</option><option>交通</option><option>趣味</option><option>衣服</option><option>美容</option><option>固定費</option><option>医療</option><option>その他</option></select></div>
        <div id="historyList" class="expense-list"></div>
      </section>
    </main>

    <footer>
      <button id="exportBtn">JSONを書き出す</button>
      <label class="import-btn">JSONを読み込む<input id="importInput" type="file" accept=".json,application/json"></label>
    </footer>
  </div>
  <div id="sharedExpenseModal" class="shared-modal" role="dialog" aria-modal="true" aria-labelledby="sharedExpenseTitle"><div class="shared-modal-card"><button id="closeSharedExpense" class="modal-close" aria-label="閉じる">×</button><p class="eyebrow">SHARED EXPENSE</p><h2 id="sharedExpenseTitle">出費の共有</h2><div class="shared-expense"><div class="shared-expense-icon">¥</div><strong id="sharedExpenseAmount">¥0</strong><span id="sharedExpenseStore">—</span><small><span id="sharedExpenseCategory">—</span> · <span id="sharedExpenseDate">—</span></small></div></div></div><div id="toast" class="toast" role="status"></div>
  <script src="./app.js?v=3"></script>
</body>
</html>
